<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dispatch Console</title>
    <meta name="description"
        content="Multi-channel radio dispatch monitoring console with real-time transcription and callsign tracking">
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <!-- Header -->
    <header class="header">
        <div class="header-left">
            <div class="logo">
                <span class="logo-icon">📡</span>
                <h1>DISPATCH CONSOLE</h1>
            </div>
            <div class="status-badge" id="status-badge">
                <span class="status-dot"></span>
                <span id="status-text">IDLE</span>
            </div>
        </div>
        <div class="header-right">
            <div class="stats-bar" id="stats-bar">
                <span class="stat-item" title="Total transcripts"><span class="stat-icon">📝</span> <span
                        id="stat-transcripts">0</span></span>
                <span class="stat-item" title="Active callsigns"><span class="stat-icon">📻</span> <span
                        id="stat-callsigns">0</span></span>
                <span class="stat-item" title="Bookmarks"><span class="stat-icon">🔖</span> <span
                        id="stat-bookmarks">0</span></span>
            </div>
            <div class="clock" id="clock"></div>
        </div>
    </header>

    <!-- Channel Tabs -->
    <div class="channel-tabs" id="channel-tabs">
        <button class="channel-tab active" data-channel="all">ALL</button>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Transcript Panel -->
        <div class="transcript-panel">
            <!-- Search Bar -->
            <div class="search-bar" id="search-bar">
                <div class="search-input-wrap">
                    <span class="search-icon">🔍</span>
                    <input type="text" id="search-input" placeholder="Search transcripts..." autocomplete="off">
                    <button class="search-clear" id="search-clear" title="Clear search">&times;</button>
                </div>
                <div class="search-filters" id="search-filters">
                    <select id="filter-channel" class="filter-select">
                        <option value="">All Channels</option>
                    </select>
                    <select id="filter-speaker" class="filter-select">
                        <option value="">All Speakers</option>
                    </select>
                    <label class="filter-check">
                        <input type="checkbox" id="filter-flagged"> Flagged only
                    </label>
                </div>
            </div>

            <!-- Transcript Content -->
            <div class="transcript-content" id="transcript">
                <div class="empty-state">
                    <div class="empty-icon">📡</div>
                    <p>Waiting for transmissions...</p>
                </div>
            </div>
        </div>

        <!-- Right Sidebar -->
        <div class="sidebar">
            <!-- Channel Level Bars -->
            <div class="card" id="level-card">
                <h3>Audio Levels</h3>
                <div id="channel-levels"></div>
            </div>

            <!-- Controls -->
            <div class="card">
                <h3>Controls</h3>
                <div class="control-buttons">
                    <button id="btn-start" class="btn btn-primary" onclick="startAll()">▶ Start All</button>
                    <button id="btn-stop" class="btn btn-danger" onclick="stopAll()">⏹ Stop All</button>
                    <button id="btn-mute" class="btn btn-secondary" onclick="toggleMute()">🔇 Mute</button>
                    <button id="btn-clear" class="btn btn-secondary" onclick="clearAll()">🗑 Clear</button>
                </div>
                <div class="export-buttons">
                    <button class="btn btn-sm" onclick="exportData('json')">📥 JSON</button>
                    <button class="btn btn-sm" onclick="exportData('csv')">📥 CSV</button>
                    <button class="btn btn-sm" onclick="exportData('txt')">📥 TXT</button>
                </div>
            </div>

            <!-- Callsign Registry -->
            <div class="card" id="callsign-card">
                <h3>Callsign Registry <span class="badge" id="callsign-count">0</span></h3>
                <div class="callsign-list" id="callsign-list">
                    <div class="empty-hint">No callsigns detected yet</div>
                </div>
            </div>

            <!-- Alerts -->
            <div class="card" id="alerts-card">
                <h3>Alerts</h3>
                <div class="alert-add">
                    <input type="text" id="alert-pattern" placeholder="Keyword or pattern..." class="alert-input">
                    <label class="filter-check">
                        <input type="checkbox" id="alert-regex"> Regex
                    </label>
                    <button class="btn btn-sm btn-primary" onclick="addAlert()">+ Add</button>
                </div>
                <div class="alert-list" id="alert-list">
                    <div class="empty-hint">No alerts configured</div>
                </div>
            </div>

            <!-- Bookmarks -->
            <div class="card" id="bookmarks-card">
                <h3>Bookmarks <span class="badge" id="bookmark-count">0</span></h3>
                <div class="bookmark-list" id="bookmark-list">
                    <div class="empty-hint">No bookmarks yet — click ★ on any entry</div>
                </div>
            </div>

            <!-- Channel Management -->
            <div class="card">
                <h3>Channels</h3>
                <div id="channel-management"></div>
                <button class="btn btn-sm btn-primary" onclick="addChannel()" style="margin-top: 8px; width: 100%;">+
                    Add Channel</button>
            </div>

            <!-- Transcription Settings -->
            <div class="card collapsible">
                <h3 class="card-toggle" onclick="toggleCard(this)">⚙ Settings <span class="toggle-icon">▸</span></h3>
                <div class="card-body collapsed">
                    <div class="setting-row">
                        <label>Model</label>
                        <select id="setting-model" class="setting-select" onchange="applySettings()">
                            <option value="tiny.en">tiny.en (fastest)</option>
                            <option value="base.en">base.en</option>
                            <option value="small.en">small.en</option>
                            <option value="medium.en">medium.en</option>
                            <option value="large-v3">large-v3 (best)</option>
                        </select>
                    </div>
                    <div class="setting-row">
                        <label>Beam Size</label>
                        <input type="range" id="setting-beam" min="1" max="10" value="5" class="setting-range"
                            oninput="this.nextElementSibling.textContent=this.value" onchange="applySettings()">
                        <span>5</span>
                    </div>
                    <div class="setting-row">
                        <label>VAD Threshold</label>
                        <input type="range" id="setting-vad" min="0.005" max="0.1" step="0.005" value="0.02"
                            class="setting-range" oninput="this.nextElementSibling.textContent=this.value"
                            onchange="applySettings()">
                        <span>0.02</span>
                    </div>
                    <div class="setting-row">
                        <label>Silence Duration</label>
                        <input type="range" id="setting-silence" min="0.5" max="5" step="0.1" value="1.5"
                            class="setting-range" oninput="this.nextElementSibling.textContent=this.value + 's'"
                            onchange="applySettings()">
                        <span>1.5s</span>
                    </div>
                </div>
            </div>

            <!-- System Info -->
            <div class="card">
                <h3>System</h3>
                <div class="system-info">
                    <span>Connections: <strong id="ws-status">Disconnected</strong></span>
                </div>
            </div>
        </div>
    </div>

    <!-- Alert Toast Container -->
    <div class="toast-container" id="toast-container"></div>

    <script src="/static/app.js"></script>
</body>

</html>
